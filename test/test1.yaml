service:
  Log_Level: info

pipeline:
  inputs:
    - name: tail
      path: ./Chapter5/basic-file.txt
      read_lines_limit: 5
      tag: basicFile
      pos_file: ./Chapter5/basic-file-read.pos_file
      read_from_head: true
      # @label: labelPipeline

    - name: tail
      path: ./Chapter5/basic-file2.txt
      read_lines_limit: 5
      tag: basicFILE2
      pos_file: ./Chapter5/basic-file-read2.pos_file
      read_from_head: true
      # @label: common

  filters:
    - name: stdout
      match: '*'

    - name: grep
      match: '*'
      regexp1: message computer

  outputs:
    - name: out_file
      match: '*'
      path: ./Chapter5/label-pipeline-file-output
      delayed_commit_timeout: 10
      flush_at_shutdown: true
      chunk_limit_records: 50
      flush_interval: 15
      flush_mode: interval
      delimiter: comma
      output_tag: true

    - name: out_file
      match: '*'
      path: ./Chapter5/alt-file-output
      delayed_commit_timeout: 10
      flush_at_shutdown: true
      chunk_limit_records: 50
      flush_interval: 5
      flush_mode: interval
      delimiter: comma
      output_tag: true

